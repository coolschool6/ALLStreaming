<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALLStreaming - Admin</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙</text></svg>">
</head>
<body>

  <div id="login-view" class="view active">
    <div class="gate-card">
      <div class="lock-icon">⚙</div>
      <h1>Admin Panel</h1>
      <p class="subtitle">Enter admin password to continue</p>
      <form id="login-form">
        <div class="input-group">
          <label for="admin-password">Password</label>
          <input
            type="password"
            id="admin-password"
            placeholder="Admin password"
            autocomplete="off"
            autofocus
          >
        </div>
        <button type="submit" class="btn-primary">Sign In</button>
      </form>
      <div id="login-error" class="error-msg"></div>
    </div>
  </div>

  <div id="dashboard-view" class="view">
    <div class="admin-container">
      <div class="admin-header">
        <h1>ALLStreaming Admin</h1>
        <button id="btn-logout" class="btn-text">Sign Out</button>
      </div>

      <div class="stats-bar">
        <div class="stat-card">
          <div class="stat-number" id="stat-total">0</div>
          <div class="stat-label">Total Keys</div>
        </div>
        <div class="stat-card stat-active">
          <div class="stat-number" id="stat-active">0</div>
          <div class="stat-label">Active</div>
        </div>
        <div class="stat-card stat-expired">
          <div class="stat-number" id="stat-expired">0</div>
          <div class="stat-label">Expired</div>
        </div>
        <div class="stat-card stat-disabled">
          <div class="stat-number" id="stat-disabled">0</div>
          <div class="stat-label">Disabled</div>
        </div>
      </div>

      <div class="admin-section">
        <div class="section-header">
          <h2>Add New Key</h2>
        </div>
        <form id="add-key-form" class="add-key-form">
          <div class="form-row">
            <div class="form-group">
              <label for="new-key-name">Key Name</label>
              <input type="text" id="new-key-name" placeholder="e.g. MY-KEY-30" required>
            </div>
            <div class="form-group">
              <label for="new-key-days">Valid Days</label>
              <input type="number" id="new-key-days" placeholder="30" min="1" max="3650">
            </div>
            <div class="form-group">
              <label for="new-key-minutes">Valid Minutes (optional)</label>
              <input type="number" id="new-key-minutes" placeholder="e.g. 5" min="1" max="1440">
            </div>
            <div class="form-group">
              <label for="new-key-note">Note (optional)</label>
              <input type="text" id="new-key-note" placeholder="e.g. For John">
            </div>
            <button type="submit" class="btn-primary btn-add">Add Key</button>
          </div>
        </form>
        <div id="add-key-msg" class="status-msg"></div>
      </div>

      <div class="admin-section">
        <div class="section-header">
          <h2>Keys</h2>
          <button id="btn-refresh" class="btn-outline btn-sm">Refresh</button>
        </div>
        <div id="keys-loading" class="loading-msg">Loading keys...</div>
        <div id="keys-table-wrap" style="display:none;">
          <table class="keys-table">
            <thead>
              <tr>
                <th>Key</th>
                <th>Days</th>
                <th>Note</th>
                <th>Activated</th>
                <th>Expires</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="keys-tbody"></tbody>
          </table>
        </div>
        <div id="keys-empty" class="empty-msg" style="display:none;">No keys found.</div>
      </div>

      <div class="admin-section">
        <div class="section-header">
          <h2>Check Key Status</h2>
        </div>
        <form id="check-key-form" class="add-key-form">
          <div class="form-row">
            <div class="form-group">
              <label for="check-key-name">Key Name</label>
              <input type="text" id="check-key-name" placeholder="e.g. ISRAEL" required>
            </div>
            <button type="submit" class="btn-primary btn-add">Check</button>
          </div>
        </form>
        <div id="check-key-msg" class="status-msg"></div>
      </div>

      <div class="admin-section">
        <div class="section-header">
          <h2>Extend Key</h2>
        </div>
        <form id="extend-key-form" class="add-key-form">
          <div class="form-row">
            <div class="form-group">
              <label for="extend-key-name">Key Name</label>
              <input type="text" id="extend-key-name" placeholder="e.g. MY-KEY-30" required>
            </div>
            <div class="form-group">
              <label for="extend-key-days">Add Days</label>
              <input type="number" id="extend-key-days" placeholder="30" min="1" max="3650" required>
            </div>
            <button type="submit" class="btn-primary btn-add">Extend</button>
          </div>
        </form>
        <div id="extend-key-msg" class="status-msg"></div>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
